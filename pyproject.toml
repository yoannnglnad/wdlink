[project]
name = "wdlink"
version = "0.1.0"
description = "Text-to-Wikidata entity linking with a GraphRAG-style re-ranker over a local SKOS graph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8.16,<3.9",
    "en-core-web-trf",
    "en-core-web-sm",
    "sentence-transformers>=6.2",
    "rdflib>=7.6",
    "networkx>=3.7",
    "rapidfuzz>=3.14",
    "wordfreq>=3.1",
    "requests>=2.34",
    # CPU wheels on Linux (CI): the default index pulls several GB of CUDA libraries
    "torch>=2.5",
]

[project.optional-dependencies]
# larger CNN pipelines, only for the spaCy model benchmark (ADR-004)
models = ["en-core-web-md", "en-core-web-lg"]

[project.scripts]
wdlink = "wdlink.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wdlink"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the Wikidata API (or a warm cache)"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
