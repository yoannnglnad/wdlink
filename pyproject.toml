[project]
name = "wdlink"
version = "0.1.0"
description = "Text-to-Wikidata entity linking with a GraphRAG-style re-ranker over a local SKOS graph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8.16,<3.9",
    "en-core-web-sm",
    "sentence-transformers>=6.2",
    "rdflib>=7.6",
    "networkx>=3.7",
    "rapidfuzz>=3.14",
    "wordfreq>=3.1",
    "requests>=2.34",
]

[project.optional-dependencies]
# transformer NER (89.9 F1 vs 84.3 for sm) — larger download, used for the NER comparison
trf = ["en-core-web-trf"]

[project.scripts]
wdlink = "wdlink.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv.sources]
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wdlink"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the Wikidata API (or a warm cache)"]
